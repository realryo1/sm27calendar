<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 末尾スラッシュを強制する。無いと style.css などの相対パスが1階層上を指して壊れる。ファイル名のあるURL（index.html など）は対象外 -->
  <script>
    if (/\/[^/.]+$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <!-- title / description / OGP は静的に置く必要がある。サイト名・説明を変えるときは data.js の site も合わせて直す -->
  <title>SNOWMIKU2027 非公式カレンダー</title>
  <meta name="description" content="SNOW MIKU 2027（2027.2.5〜2.7）のメインイベント・LIVE・Digital Stars・ファンメイドライブ・雪ミク電車を会場別にまとめた非公式カレンダー。雪ミク電車の在線予測つき。">
  <link rel="canonical" href="https://realryo1.github.io/sm27calendar/">

  <!-- OGP -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SNOWMIKU2027 非公式カレンダー">
  <meta property="og:title" content="SNOWMIKU2027 非公式カレンダー">
  <meta property="og:description" content="2027.2.5〜2.7 のメインイベント・LIVE・Digital Stars・ファンメイドライブ・雪ミク電車を会場別にまとめた非公式カレンダー。雪ミク電車の在線予測つき。">
  <meta property="og:url" content="https://realryo1.github.io/sm27calendar/">
  <meta property="og:image" content="https://realryo1.github.io/sm27calendar/image/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SNOWMIKU2027 非公式カレンダー 2027.2.5 FRI – 2.7 SUN">
  <meta property="og:locale" content="ja_JP">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SNOWMIKU2027 非公式カレンダー">
  <meta name="twitter:description" content="メインイベント・LIVE・Digital Stars・ファンメイドライブ・雪ミク電車を会場別にまとめた非公式カレンダー。雪ミク電車の在線予測つき。">
  <meta name="twitter:image" content="https://realryo1.github.io/sm27calendar/image/ogp.png">
  <meta name="twitter:image:alt" content="SNOWMIKU2027 非公式カレンダー 2027.2.5 FRI – 2.7 SUN">
  <meta name="theme-color" content="#ffffff">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="image/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="image/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="雪ミク27">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- フォントの CSS は大きく表示を止めてしまうので、非同期で読み込む（読み込むまでは端末のフォントで表示） -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"></noscript>
  <link rel="stylesheet" href="style.css">
  <script src="precache.js" defer></script>
  <script src="data.js" defer></script>
  <script src="train.js" defer></script>
  <script src="app.js" defer></script>
  <script src="train-view.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <main class="main">
    <section class="board">
      <h1 class="day-nav__title" id="siteTitle"></h1>
      <nav class="day-nav" aria-label="日付へ移動">
        <span id="dayNav" style="display:contents"></span>
        <a class="day-chip day-chip--train" id="trainChip" href="#train-live"></a>
        <span class="day-nav__break" aria-hidden="true"></span>
      </nav>
      <div class="tt-scroll" id="ttScroll">
        <div class="tt" id="tt"></div>
      </div>
      <ul class="legend" id="legend"></ul>
      <p class="board__hint" id="boardHint"></p>
    </section>
    <!-- 2カラム表示のときだけ出る、時間割と会場一覧の比率を変える持ち手（app.js） -->
    <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="時間割と会場一覧の幅" tabindex="0"></div>

    <div class="main__inner">
      <section class="venues" id="venues">
        <h2 class="section-title" id="venuesTitle"></h2>
        <div class="venue-list" id="venueList"></div>
      </section>

      <footer class="site-footer">
        <p class="site-footer__updated" id="updatedAt"></p>
        <p id="disclaimer"></p>
        <p class="site-footer__repo"><a id="repoLink" target="_blank" rel="noopener"></a></p>
      </footer>
    </div>
  </main>

  <button type="button" class="to-board" id="toBoard" hidden></button>
</body>
</html>
