<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 末尾スラッシュを強制する（カレンダーの index.html と同じ）。無いと相対パスが1階層上を指して壊れる -->
  <script>
    if (/\/[^/.]+$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <!-- 試験ページ：検索に載せない。カレンダーからはリンクしない。PWA の対象外（sw.js は test_ で始まるフォルダをキャッシュしない） -->
  <meta name="robots" content="noindex">
  <title>ウイングベイ出展ブースマップ（試験版）</title>
  <meta name="description" content="ウイングベイ小樽の出展ブースで売っているものを、会場マップと出展企業ごとにまとめた非公式ページの試験版。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" href="../image/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- フォントの CSS は表示を止めないよう非同期で読み込む（カレンダーと同じ） -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"></noscript>
  <!-- 配色・フォント・背景・フッターはカレンダーの style.css をそのまま使う（変えたときに、このページも一緒に変わるように） -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="goodsmap.css">
  <!-- 年ごとのデータ。27年の情報が出たら data-2027.js を作って差し替える -->
  <script src="data-2026fix.js" defer></script>
  <script src="goodsmap.js" defer></script>
</head>
<body>
  <div class="gm">
    <noscript><p>このページはJavaScriptを使います。公式サイトの<a href="https://snowmiku.com/2026/location_wingbay.html#wingbay_sponsor">出展ブース</a>もご覧ください。</p></noscript>
    <!-- 2カラム（641px〜）では、左のマップと右の一覧がそれぞれスクロールし、ページ全体はスクロールしない。間の持ち手で幅を変える -->
    <main class="gm-main" id="gmMain">
      <h1 class="gm-visually-hidden">ウイングベイ出展ブースマップ</h1>
      <section class="gm-sec gm-sec--map" id="map" aria-label="会場マップ">
        <div class="gm-floors" id="gmFloors" hidden></div>
        <div class="gm-mapbox" id="gmMapbox">
          <div class="gm-maptools">
            <p class="gm-maptools__floor" id="gmFloorLabel"></p>
            <div class="gm-zoom" id="gmZoom"></div>
          </div>
          <!-- 会場マップ（goodsmap.js が SVG で描く） -->
          <div class="gm-map" id="gmMap"></div>
          <p class="gm-maphint" id="gmMapHint"></p>
          <ul class="gm-legend" id="gmLegend"></ul>
        </div>
      </section>
      <!-- 2カラムのときだけ出る、マップと一覧の幅を変える持ち手（goodsmap.js） -->
      <div class="gm-split" id="gmSplit" role="separator" aria-orientation="vertical" aria-label="マップと一覧の幅" tabindex="0"></div>

      <section class="gm-sec gm-sec--list" id="booths" aria-label="出展ブース">
        <div class="gm-tools">
          <label class="gm-search">
            <span class="gm-search__icon" aria-hidden="true"></span>
            <input type="search" id="gmQuery" autocomplete="off" enterkeyhint="search">
          </label>
          <div class="gm-chips" id="gmChips" role="group"></div>
        </div>
        <!-- 2カラムでは、検索欄の下だけがスクロールする（検索欄の角の外にカードが見えないように） -->
        <div class="gm-scroll">
          <p class="gm-notice" id="gmNotice" hidden></p>
          <p class="gm-lead" id="gmLead"></p>
          <div class="gm-list" id="gmList"></div>
          <p class="gm-empty" id="gmEmpty" hidden></p>
          <footer class="site-footer gm-footer" id="gmFooter"></footer>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
