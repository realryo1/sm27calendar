<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- 末尾スラッシュを強制する（カレンダーの index.html と同じ）。無いと相対パスが1階層上を指して壊れる -->
  <script>
    if (/\/[^/.]+$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <!-- 試験ページ：検索に載せない。カレンダーからはサイドバー（nav.js。github.io では出さない）から ?embed=1 の iframe で開く。オフライン保存は新しいドメインと手元だけ（precache.js の PRECACHE_GOODSMAP） -->
  <meta name="robots" content="noindex">
  <!-- ?page=goods でグッズ一覧（goods.js）、無ければグッズ・出展ブースマップ（goodsmap.js）。データ・一覧の部品・スタイルは共通。タイトルは下で付け直す -->
  <title>グッズ・出展ブースマップ（試験版）</title>
  <meta name="description" content="ウイングベイ小樽の出展ブース・チ・カ・ホで売っているものを、会場マップと出展企業ごと・売り場ごとにまとめた非公式ページの試験版。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" href="../image/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- フォントの CSS は表示を止めないよう非同期で読み込む（カレンダーと同じ） -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"></noscript>
  <!-- 配色・フォント・背景・フッターはカレンダーと共通の base.css をそのまま使う（変えたときに、このページも一緒に変わるように） -->
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="goodsmap.css">
  <link rel="stylesheet" href="goods.css">
  <!-- 年ごとのデータ。既定は27年（data-2027.js）。?year=2026 で前年の見本（data-2026fix.js）。defer の順番を守るため document.write で書く -->
  <script>
    // グッズ一覧のとき（?page=goods）。html の .gd-page でマップを隠して一覧を出す（goods.css）
    window.GM_PAGE = new URLSearchParams(location.search).get("page") === "goods" ? "goods" : "map";
    if (window.GM_PAGE === "goods") {
      document.documentElement.classList.add("gd-page");
      document.title = "グッズ一覧（試験版）";
    }
    // カレンダーの中（?embed=1）のとき、下の安全な余白（--safe-b）は親のものを使う。
    // iframe の中は env(safe-area-inset-bottom) が 0 になるので、そのままだと浮かぶボタンなどが親の下のバーに重なる
    // （スマホのブラウザは親が 24px。アプリ表示は親も iframe も fullscreen の最低 16px で偶然そろう）
    if (new URLSearchParams(location.search).has("embed")) {
      const sync = () => {
        try {
          const cs = getComputedStyle(parent.document.documentElement);
          const st = document.documentElement.style;
          st.setProperty("--safe-b", cs.getPropertyValue("--safe-b"));
          // 下のバーの帯（.app-nav。ボタンの10px上から色がつく）に iframe が重なっている高さ（スマホは帯全体、2カラムはバーの上で止まるので帯の上の余白の分）。
          // 全画面のマップがバーの上で止まるのに使う。下にバーが無いPCの縦バーのときは 0
          const bar = parent.document.querySelector(".app-nav");
          const over = bar && cs.getPropertyValue("--nav-w").trim() === "0px" ? Math.max(0, frameElement.getBoundingClientRect().bottom - bar.getBoundingClientRect().top) : 0;
          st.setProperty("--embed-nav-h", `${Math.round(over)}px`);
          document.documentElement.classList.toggle("is-embed-bar", over > 0); // 下に帯があるとき（goodsmap.css の浮かぶボタンの右端をバーにそろえる）
        } catch {}
      };
      sync();
      addEventListener("resize", sync);
      window.GM_SYNC = sync; // 全画面にするとき（goodsmap.js の setFull）にも測り直す
    }
    document.write(`<script src="${new URLSearchParams(location.search).get("year") === "2026" ? "data-2026fix.js" : "data-2027.js"}" defer><\/script>`);
  </script>
  <script src="../util.js" defer></script>
  <!-- 一覧の部品（品の行・タグ・カード）。マップとグッズ一覧で共通 -->
  <script src="goodslist.js" defer></script>
  <!-- ほしいものリスト（マップとグッズ一覧で共通。一覧を描いたあとに各ページが呼ぶ） -->
  <script src="wishlist.js" defer></script>
  <script>
    document.write(`<script src="${window.GM_PAGE === "goods" ? "goods.js" : "goodsmap.js"}" defer><\/script>`);
  </script>
</head>
<body>
  <div class="gm">
    <noscript><p>このページはJavaScriptを使います。公式サイトの<a href="https://snowmiku.com/2026/location_wingbay.html#wingbay_sponsor">出展ブース</a>もご覧ください。</p></noscript>
    <!-- 2カラム（641px〜）では、左のマップと右の一覧がそれぞれスクロールし、ページ全体はスクロールしない。間の持ち手で幅を変える -->
    <main class="gm-main" id="gmMain">
      <h1 class="gm-visually-hidden">グッズ・出展ブースマップ</h1>
      <section class="gm-sec gm-sec--map" id="map" aria-label="会場マップ">
        <div class="gm-mapbox" id="gmMapbox">
          <!-- フロアのタブ（スマホではマップの枠が上に重なるので、枠の中に置く） -->
          <div class="gm-floors" id="gmFloors" hidden></div>
          <div class="gm-maptools">
            <p class="gm-maptools__floor" id="gmFloorLabel"></p>
            <div class="gm-zoom" id="gmZoom"></div>
          </div>
          <!-- 会場マップ（goodsmap.js が SVG で描く） -->
          <div class="gm-map" id="gmMap"></div>
          <p class="gm-maphint" id="gmMapHint"></p>
          <ul class="gm-legend" id="gmLegend"></ul>
        </div>
      </section>
      <!-- 2カラムのときだけ出る、マップと一覧の幅を変える持ち手（goodsmap.js） -->
      <div class="gm-split" id="gmSplit" role="separator" aria-orientation="vertical" aria-label="マップと一覧の幅" tabindex="0"></div>

      <section class="gm-sec gm-sec--list" id="booths" aria-label="出展ブース">
        <div class="gm-tools" id="gmTools">
          <label class="gm-search">
            <span class="gm-search__icon" aria-hidden="true"></span>
            <input type="search" id="gmQuery" autocomplete="off" enterkeyhint="search">
          </label>
          <div class="gm-chips" id="gmChips" role="group"></div>
        </div>
        <!-- 2カラムでは、検索欄の下だけがスクロールする（検索欄の角の外にカードが見えないように） -->
        <div class="gm-scroll">
          <p class="gm-lead" id="gmLead"></p>
          <div class="gm-list" id="gmList"></div>
          <p class="gm-empty" id="gmEmpty" hidden></p>
          <footer class="site-footer gm-footer" id="gmFooter"></footer>
        </div>
      </section>
    </main>
    <!-- グッズ一覧（?page=goods のときだけ出す。goods.js が描く）。2カラム（641px〜）では、左に一覧・右にほしいものリスト（wishlist.js が描く） -->
    <div class="gd-cols">
    <main class="gd-main">
      <h1 class="gm-visually-hidden">グッズ一覧</h1>
      <!-- 検索と、売り場（すべて・公式物販・企業ブース・ライブ物販）のしぼり込み -->
      <section class="gd-guide" aria-label="さがす・しぼり込む">
        <label class="gm-search">
          <span class="gm-search__icon" aria-hidden="true"></span>
          <input type="search" id="gdQuery" autocomplete="off" enterkeyhint="search">
        </label>
        <div id="gdGuide"></div>
      </section>
      <div class="gd-list" id="gdList"></div>
      <p class="gm-empty" id="gdEmpty" hidden></p>
      <footer class="site-footer gm-footer" id="gdFooter"></footer>
    </main>
    <!-- 2カラムのときだけ出る、一覧とほしいものリストの幅を変える持ち手（goods.js） -->
    <div class="gm-split gd-split" id="gdSplit" role="separator" aria-orientation="vertical" aria-label="一覧とほしいものリストの幅" tabindex="0"></div>
    <aside class="gd-wish gm-wishlist" id="gdWish" aria-label="ほしいものリスト"></aside>
    </div>
  </div>

</body>
</html>
