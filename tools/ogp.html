<!doctype html>
<!-- OGP 画像（website/image/ogp.png）の元データ。1200x630 でスクリーンショットして書き出す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4F458F; --pink: #DD67E2; --pink-d: #873890; --pink-l: #F7BFFF;
    --violet: #9185DE; --violet-l: #BFB5FF; --violet-ll: #f4f1ff;
    --orange: #D08100; --gold: #b5a43a; --indigo: #4F458F; --teal: #2E9CAA;
    --gold-grad: linear-gradient(to right, #736B32 0%, #D9CA5E 20%, #FFFFFF 30%, #D9CA5E 50%, #736B32 90%);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
    font-feature-settings: "palt";
    background:
      radial-gradient(circle at 8% 0%, var(--pink-l) 0, transparent 45%),
      radial-gradient(circle at 100% 100%, var(--violet-l) 0, transparent 50%),
      var(--violet-ll);
  }
  body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--gold-grad);
  }
  .snow { position: absolute; color: #fff; opacity: .9; font-size: 28px; }

  .text { position: absolute; left: 60px; top: 10px; width: 600px; }
  .brand { font-family: "Dela Gothic One"; letter-spacing: .1em; color: var(--pink); }
  h1 { margin-top: 14px; font-size: 76px; font-weight: 900; line-height: 1.18; letter-spacing: .02em; }
  h1 span { display: block; font-size: 58px; }
  .date {
    display: inline-flex; align-items: baseline; gap: 14px; margin-top: 20px; padding: 10px 26px; border-radius: 999px;
    font-family: "Dela Gothic One"; font-size: 30px; color: #fff;
    background: linear-gradient(to bottom right, var(--pink), var(--violet));
    box-shadow: 0 8px 20px rgb(135 56 144 / .25);
  }
  .date small { font-size: 18px; letter-spacing: .1em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 18px; width: 620px; }
  .tags span {
    padding: 4px 14px; border-radius: 999px; font-size: 19px; font-weight: 700;
    background: #fff; border: 2px solid var(--violet-l);
  }
  .foot { position: absolute; left: 60px; bottom: 40px; font-size: 18px; font-weight: 700; opacity: .7; }

  /* 右側：アプリアイコン（tools/icon-app.html）の白い板・4つのタイル・♡27。背景の紫はOGPの背景にまかせる */
  .board {
    position: absolute; right: 70px; top: 72px; width: 470px; height: 470px;
    transform: rotate(3deg); filter: drop-shadow(0 20px 40px rgb(79 69 143 / .25));
  }
  .board svg { display: block; width: 100%; height: 100%; }
  .board .t { font-family: "Dela Gothic One"; }
</style>
</head>
<body>
  <span class="snow" style="left:640px;top:40px">❄</span>
  <span class="snow" style="left:600px;top:520px;font-size:22px">❄</span>
  <span class="snow" style="left:40px;top:560px;font-size:20px">❄</span>

  <div class="text">
    <h1 class="brand">SNOW 
    MIKU 
    2027</h1>
    <h1><span>非公式アプリ</span></h1>
    <p class="date">2027.2.4 <small>THU</small> – 2.7 <small>SUN</small></p>
    <div class="tags"><span>本祭</span><span>LIVE</span><span>Digital Stars</span><span>チ・カ・ホ</span><span>雪ミク電車</span><span>会場マップ</span><span>グッズ一覧</span><span>運行情報</span></div>
  </div>
  <p class="foot">非公式ファンメイド / @realryo1 作成</p>

  <!-- 形・色・座標は tools/icon-app.html と同じ（表示する範囲を白い板のまわりにしただけ）。アイコンを変えたらここも合わせる -->
  <div class="board">
    <svg viewBox="15 15 70 70">
      <defs>
        <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E9A1EB"/><stop offset="1" stop-color="#9F6FD0"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFF7C8"/><stop offset=".3" stop-color="#E8D774"/><stop offset=".6" stop-color="#B9A23C"/><stop offset=".85" stop-color="#D9CA5E"/><stop offset="1" stop-color="#F3E79A"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4F458F" flood-opacity=".3"/>
        </filter>
        <g id="i-calendar"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
        <g id="i-map"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></g>
        <g id="i-bag"><path d="M5 8h14l-1 12.5H6L5 8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></g>
        <g id="i-train"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M9 13.5h.01M15 13.5h.01M8 21l2-4M16 21l-2-4"/></g>
      </defs>
      <rect x="15" y="15" width="70" height="70" rx="17" fill="#fff"/>
      <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="21" y="21" width="27" height="27" rx="7" fill="#DD67E2" stroke="none"/>
        <rect x="52" y="21" width="27" height="27" rx="7" fill="#9185DE" stroke="none"/>
        <rect x="21" y="52" width="27" height="27" rx="7" fill="#F2A31B" stroke="none"/>
        <rect x="52" y="52" width="27" height="27" rx="7" fill="#4F458F" stroke="none"/>
        <use href="#i-calendar" transform="translate(25.5 25.5) scale(.75)"/>
        <use href="#i-map" transform="translate(56.5 25.5) scale(.75)"/>
        <use href="#i-bag" transform="translate(25.5 56.5) scale(.75)"/>
        <use href="#i-train" transform="translate(56.5 56.5) scale(.75)"/>
      </g>
      <path d="M50 68C30 57 29.5 40 39.5 37.2c4.8-1.3 8.4 1.2 10.5 4.3 2.1-3.1 5.7-5.6 10.5-4.3 10 2.8 9.5 19.8-10.5 30.8z" fill="url(#heart)" stroke="url(#gold)" stroke-width="2.8" stroke-linejoin="round" filter="url(#shadow)"/>
      <text class="t" x="50" y="55.5" font-size="11.5" text-anchor="middle" fill="#fff">27</text>
      <g fill="#fff">
        <circle cx="47.4" cy="62.3" r=".85"/><circle cx="50" cy="63.8" r=".85"/><circle cx="52.6" cy="62.3" r=".85"/>
        <circle cx="55" cy="60.5" r=".85"/><circle cx="57.2" cy="58.5" r=".85"/><circle cx="59.2" cy="56.3" r=".85"/>
      </g>
    </svg>
  </div>
</body>
</html>
