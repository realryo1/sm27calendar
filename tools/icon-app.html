<!doctype html>
<!-- 新しいドメインのアプリアイコン（website/image/app/icon-maskable-512.png）の元データ。iconnew.html の案A5。
     正方形のウィンドウ（512×512）でスクリーンショットして書き出す。デプロイ時に image/ の同じ名前のファイルに上書きされる（README の「公開先」）。
     maskable 対応のため背景は全面、図柄は中央の円（直径80%）に収める。中の線のアイコンはサイドバー（website/nav.js の ICONS）と同じ形。
     ?favicon を付けると、真ん中の♡と27だけを背景なし・全面で出す（favicon.ico・image/favicon-32.png の元。github.io と新しいドメインで共通）。
     小さく表示されるので、影と点は省く。♡につやの光（スペキュラ）を足す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  .t { font-family: "Dela Gothic One", sans-serif; }
  .favicon .full, .favicon .dots { display: none; }
  .favicon .heart { filter: none; stroke-width: 2.6; }
  .spec { display: none; }
  .favicon .spec { display: inline; }
</style>
</head>
<body>
  <script>
    if (location.search.includes("favicon")) document.documentElement.classList.add("favicon");
  </script>
  <svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#DD67E2"/><stop offset="1" stop-color="#9185DE"/>
      </linearGradient>
      <radialGradient id="glow" cx=".2" cy=".1" r=".55">
        <stop offset="0" stop-color="#F7BFFF"/><stop offset="1" stop-color="#F7BFFF" stop-opacity="0"/>
      </radialGradient>
      <!-- ♡（上が明るい紫、下が濃い紫） -->
      <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E9A1EB"/><stop offset="1" stop-color="#9F6FD0"/>
      </linearGradient>
      <!-- ♡の金のふち（style.css の --col-gold を中心に、左上が明るく、右下に向けて暗くなり、右下でまた少し照り返す） -->
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFF7C8"/><stop offset=".3" stop-color="#E8D774"/><stop offset=".6" stop-color="#B9A23C"/><stop offset=".85" stop-color="#D9CA5E"/><stop offset="1" stop-color="#F3E79A"/>
      </linearGradient>
      <!-- favicon の♡のつや（白から透明へ） -->
      <radialGradient id="spec">
        <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4F458F" flood-opacity=".3"/>
      </filter>
      <!-- サイドバーと同じ線のアイコン（24×24） -->
      <g id="i-calendar"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
      <g id="i-map"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></g>
      <g id="i-bag"><path d="M5 8h14l-1 12.5H6L5 8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></g>
      <g id="i-train"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M9 13.5h.01M15 13.5h.01M8 21l2-4M16 21l-2-4"/></g>
    </defs>
    <g class="full">
    <rect width="100" height="100" fill="url(#bg)"/>
    <rect width="100" height="100" fill="url(#glow)"/>
    <!-- 白い板に、カレンダー・マップ・グッズ・運行情報の4色のタイル -->
    <rect x="15" y="15" width="70" height="70" rx="17" fill="#fff" filter="url(#shadow)"/>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="21" y="21" width="27" height="27" rx="7" fill="#DD67E2" stroke="none"/>
      <rect x="52" y="21" width="27" height="27" rx="7" fill="#9185DE" stroke="none"/>
      <rect x="21" y="52" width="27" height="27" rx="7" fill="#F2A31B" stroke="none"/>
      <rect x="52" y="52" width="27" height="27" rx="7" fill="#4F458F" stroke="none"/>
      <use href="#i-calendar" transform="translate(25.5 25.5) scale(.75)"/>
      <use href="#i-map" transform="translate(56.5 25.5) scale(.75)"/>
      <use href="#i-bag" transform="translate(25.5 56.5) scale(.75)"/>
      <use href="#i-train" transform="translate(56.5 56.5) scale(.75)"/>
    </g>
    </g>
    <!-- 真ん中の♡と27 -->
    <path d="M50 68C30 57 29.5 40 39.5 37.2c4.8-1.3 8.4 1.2 10.5 4.3 2.1-3.1 5.7-5.6 10.5-4.3 10 2.8 9.5 19.8-10.5 30.8z" fill="url(#heart)" stroke="url(#gold)" stroke-width="2.8" stroke-linejoin="round" class="heart" filter="url(#shadow)"/>
    <!-- favicon だけ：♡の左上のふくらみのつやと、金のふちの照り -->
    <g class="spec">
      <ellipse cx="40.5" cy="43" rx="5.5" ry="3" transform="rotate(-35 40.5 43)" fill="url(#spec)"/>
      <ellipse cx="35.8" cy="39.8" rx="2" ry=".9" transform="rotate(-40 35.8 39.8)" fill="#fff" opacity=".9"/>
    </g>
    <text class="t" x="50" y="55.5" font-size="11.5" text-anchor="middle" fill="#fff">27</text>
    <!-- 点：♡を中心（50,52）に向けて0.74倍に縮めた線の上に、下の先から線に沿って3ずつ離して置く（左へ1つ、右上へ4つ）。
         位置は計算して書いたもの。♡の形や縮める割合を変えたら置き直す -->
    <g class="dots" fill="#fff">
      <circle cx="47.4" cy="62.3" r=".85"/>
      <circle cx="50" cy="63.8" r=".85"/>
      <circle cx="52.6" cy="62.3" r=".85"/>
      <circle cx="55" cy="60.5" r=".85"/>
      <circle cx="57.2" cy="58.5" r=".85"/>
      <circle cx="59.2" cy="56.3" r=".85"/>
    </g>
  </svg>
  <script>
    // favicon：♡（白いふちまで）が全面に入るよう、表示する範囲を♡のまわりの正方形にする
    if (document.documentElement.classList.contains("favicon")) document.querySelector("svg").setAttribute("viewBox", "28.3 31 43.4 43.4");
  </script>
</body>
</html>
